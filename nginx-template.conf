# ============================================================================
# BraanX - Nginx Reverse Proxy Configuration Template
# ============================================================================
# Replace SERVER_DOMAIN and SERVER_IP with actual values.
# SSL certificate paths point to /etc/braanx/ssl/
# All WebSocket and gRPC locations proxy to XRay internal ports.
# ============================================================================

# --------------------------------------------------------------------------
# gRPC proxy parameters (shared snippet)
# Include this as /etc/nginx/snippets/grpc-proxy-params.conf
# --------------------------------------------------------------------------
# grpc_pass_header Server;
# grpc_set_header Host $host;
# grpc_set_header X-Real-IP $remote_addr;
# grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# grpc_socket_keepalive on;
# grpc_read_timeout 300s;
# grpc_send_timeout 300s;

# --------------------------------------------------------------------------
# HTTPS Server Block - Port 443 (TLS Termination)
# --------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SERVER_DOMAIN;

    # SSL / TLS
    ssl_certificate     /etc/braanx/ssl/fullchain.pem;
    ssl_certificate_key /etc/braanx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # VLESS WebSocket
    location /vless-ws {
        proxy_pass http://127.0.0.1:2001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # VMess WebSocket
    location /vmess-ws {
        proxy_pass http://127.0.0.1:2004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Trojan WebSocket
    location /trojan-ws {
        proxy_pass http://127.0.0.1:2007;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSH-over-WebSocket
    location /ssh-ws {
        proxy_pass http://127.0.0.1:2222;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # VLESS gRPC
    location /vless-grpc {
        grpc_pass grpc://127.0.0.1:2002;
        include /etc/nginx/snippets/grpc-proxy-params.conf;
    }

    # VMess gRPC
    location /vmess-grpc {
        grpc_pass grpc://127.0.0.1:2005;
        include /etc/nginx/snippets/grpc-proxy-params.conf;
    }

    # Trojan gRPC
    location /trojan-grpc {
        grpc_pass grpc://127.0.0.1:2008;
        include /etc/nginx/snippets/grpc-proxy-params.conf;
    }

    # VLESS HTTPUpgrade
    location /vless-hupg {
        proxy_pass http://127.0.0.1:2003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # VMess HTTPUpgrade
    location /vmess-hupg {
        proxy_pass http://127.0.0.1:2006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # Trojan HTTPUpgrade
    location /trojan-hupg {
        proxy_pass http://127.0.0.1:2009;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # Default fallback
    location / {
        proxy_pass http://127.0.0.1:1010;
        proxy_set_header Host $host;
    }
}

# --------------------------------------------------------------------------
# HTTP Server Block - Port 80 (Non-TLS)
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name SERVER_DOMAIN;

    # VLESS Non-TLS WebSocket
    location /vless-ntls {
        proxy_pass http://127.0.0.1:2011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # VMess Non-TLS WebSocket
    location /vmess-ntls {
        proxy_pass http://127.0.0.1:2012;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------
# Fake Page Server - Port 1010 (Camouflage)
# --------------------------------------------------------------------------
server {
    listen 1010;
    server_name _;

    root /var/www/braanx;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
